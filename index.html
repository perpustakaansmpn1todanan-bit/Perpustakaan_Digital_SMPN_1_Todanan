<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Perpustakaan Digital SMPN 1 Todanan</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A8A">

<!-- Untuk iOS Safari (add to home screen) -->
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Perpus Digital">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #1E3A8A;
  }
  #app-frame {
    border: none;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: block;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    background: #1E3A8A;
    color: white;
    font-family: system-ui, -apple-system, sans-serif;
    z-index: 10;
    transition: opacity 0.3s ease;
  }
  #loading img {
    width: 96px;
    height: 96px;
  }
  #loading.hide {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="loading">
  <img src="icon-192.png" alt="Perpustakaan Digital">
  <div>Memuat Perpustakaan Digital...</div>
</div>

<iframe
  id="app-frame"
  src="https://script.google.com/macros/s/AKfycbw5V4lqgSCAbBWtRxrShHL2gWqcPC7SXBvzzK285qJaS4qupdH1F5gWjV5Z0O0uGm-S/exec"
  title="OPAC Perpustakaan Digital"
  onload="document.getElementById('loading').classList.add('hide')"
></iframe>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((err) => {
        console.error("Service worker gagal didaftarkan:", err);
      });
    });
  }
</script>

</body>
</html>
